import groovy.json.JsonSlurper
import moe.caa.multilogin.build.ResolveVelocityArtifactTask

plugins {
    id 'com.gradleup.shadow' version '9.1.0'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.elytrium.net/repo/' }
}

def targetVelocityVersion = '4.1.0-SNAPSHOT'
def velocityTarget = layout.projectDirectory.file('libraries/velocity-4.1-target.jar')
def velocityLock = layout.projectDirectory.file('libraries/velocity-4.1-target.json')
def generatedVelocityResources = layout.buildDirectory.dir('generated/resources/velocityTarget')

def resolveVelocityArtifact = tasks.register(
        'resolveVelocityArtifact',
        ResolveVelocityArtifactTask) {
    group = 'velocity'
    description = 'Resolves and verifies the official Velocity 4.1 server artifact.'
    velocityVersion.set(targetVelocityVersion)
    requestedBuild.set(providers.gradleProperty('velocityBuild').map(Integer.&valueOf))
    offline.set(gradle.startParameter.offline)
    artifactFile.set(velocityTarget)
    lockFile.set(velocityLock)
}

def generateVelocityTargetMetadata = tasks.register('generateVelocityTargetMetadata') {
    group = 'velocity'
    description = 'Generates metadata describing the Velocity artifact used at compile time.'
    dependsOn resolveVelocityArtifact
    inputs.file(velocityLock)
    outputs.file(generatedVelocityResources.map { it.file('velocity-target.properties') })

    doLast {
        def lock = new JsonSlurper().parse(velocityLock.asFile)
        def output = generatedVelocityResources.get().file('velocity-target.properties').asFile
        output.parentFile.mkdirs()
        output.setText(
                "velocity.version=${lock.version}\n" +
                        "velocity.build=${lock.id}\n" +
                        "velocity.commit=${lock.commitSha}\n" +
                        "velocity.sha256=${lock.sha256}\n",
                'UTF-8')
    }
}

sourceSets.main.resources.srcDir(generatedVelocityResources)

sourceSets {
    smokeTest {
        java.srcDir('src/smokeTest/java')
        resources.srcDir('src/smokeTest/resources')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += output + compileClasspath
    }
}

configurations {
    smokeTestImplementation.extendsFrom(testImplementation)
    smokeTestRuntimeOnly.extendsFrom(testRuntimeOnly)
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    implementation project(':api')
    implementation project(':flows')
    implementation project(':loader')

    compileOnly files(velocityTarget)
    compileOnly 'io.netty:netty-all:4.1.86.Final'
    compileOnly 'net.minecrell:terminalconsoleappender:1.3.0'

    testImplementation files(velocityTarget)
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn resolveVelocityArtifact
}

tasks.withType(Test).configureEach {
    dependsOn resolveVelocityArtifact
    useJUnitPlatform()
}

tasks.named('processResources') {
    dependsOn generateVelocityTargetMetadata
}

tasks.register('velocitySmokeTest', Test) {
    group = 'verification'
    description = 'Starts the resolved official Velocity server with the built plugin.'
    dependsOn tasks.named('shadowJar')
    dependsOn resolveVelocityArtifact
    testClassesDirs = sourceSets.smokeTest.output.classesDirs
    classpath = sourceSets.smokeTest.runtimeClasspath
    useJUnitPlatform()
    doFirst {
        systemProperty 'multilogin.velocityJar', velocityTarget.asFile.absolutePath
        systemProperty 'multilogin.pluginJar', tasks.named('shadowJar').get()
                .archiveFile.get().asFile.absolutePath
    }
}

evaluationDependsOn(':velocity:injector')

def coreShadowArchive = project(':core').tasks.named('shadowJar').flatMap { it.archiveFile }
def injectorShadowArchive = project(':velocity:injector').tasks.named('shadowJar').flatMap { it.archiveFile }

shadowJar {
    archiveBaseName.set('MultiLogin-Velocity')

    if (System.getProperty('env', 'AUTO') == 'final') {
        archiveVersion.set(project.plugin_version as String)
    } else {
        String ver = 'Build_' + version
        archiveVersion.set(ver)
    }
    archiveClassifier.set('')
    from(coreShadowArchive)
    from(injectorShadowArchive)
}

artifacts {
    archives shadowJar
}
