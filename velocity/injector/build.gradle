plugins {
    id 'com.gradleup.shadow'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.elytrium.net/repo/' }
}

def velocityTarget = project(':velocity').layout.projectDirectory.file(
        'libraries/velocity-4.1-target.jar')
def resolveVelocityArtifact = project(':velocity').tasks.named('resolveVelocityArtifact')

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

dependencies {
    compileOnly project(':api')
    compileOnly project(':core')
    compileOnly project(':velocity')

    compileOnly files(velocityTarget)
    compileOnly 'io.netty:netty-all:4.1.86.Final'
    compileOnly 'net.minecrell:terminalconsoleappender:1.3.0'

    testImplementation project(':api')
    testImplementation project(':core')
    testImplementation files(velocityTarget)
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn resolveVelocityArtifact
}

tasks.withType(Test).configureEach {
    dependsOn resolveVelocityArtifact
    useJUnitPlatform()
}

shadowJar {
    archiveFileName = 'MultiLogin-Velocity-Injector.JarFile'
}

artifacts {
    archives shadowJar
}
